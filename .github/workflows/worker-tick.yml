name: Worker · Tick shard 0 (every 5 min)

# Sharded worker — this file is shard 0 of 3. Two sibling workflows
# (worker-tick-shard-1.yml, worker-tick-shard-2.yml) handle shards 1 and 2.
# Each shard fetches queued scrape_runs, filters by
# (competitor_id % SHARD_COUNT) === SHARD_INDEX, processes up to 5 runs.
# Row-level locking in runScrapeJob prevents cross-shard collisions.
#
# Effect: 3 competitors' scrapes can run truly in parallel across 3 GH
# runners. Combined with per-competitor parallel URL scraping (5-10
# concurrent pages), theoretical throughput vs old sequential design is
# ~15-30×. Practical gain is 3-5× because GH throttles cron on public
# repos and runner allocation isn't guaranteed.
#
# Playwright browsers are cached across runs so cold start is ~30s
# instead of ~3 min.
#
# Public repo has unlimited Actions minutes, so cost is $0.

# DISABLED 2026-07-29 — scraping moved to the always-on Render worker
# (worker/src/index.js). The schedule + push auto-triggers are removed so
# these GitHub Actions ticks no longer run redundantly. workflow_dispatch is
# kept so you can still fire a one-off tick manually from the Actions tab.
# To re-enable cron: restore `schedule:` with `- cron: '*/5 * * * *'`.
on:
  workflow_dispatch:

# Skip if a previous shard-0 tick is still running — prevents queue thrashing.
# Note: the group name includes the shard index so shards 0/1/2 have
# INDEPENDENT concurrency locks and can run truly in parallel.
concurrency:
  group: worker-tick-shard-0
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install worker deps
        working-directory: worker
        run: npm ci

      # Cache Playwright browsers between runs
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.48-${{ runner.os }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: worker
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (from cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: worker
        run: npx playwright install-deps chromium

      - name: Run tick (shard 0/3)
        working-directory: worker
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY:            ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM:                ${{ secrets.ALERT_FROM }}
          HTTP_PROXY:                ${{ secrets.HTTP_PROXY }}
          SHARD_INDEX: '0'
          SHARD_COUNT: '3'
        run: node src/tick.js
